<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f4">
<title>Still & Seen — Photo Gallery</title>
<style>
:root { color-scheme: light dark; --page: light-dark(#f7f7f4,#171816); --surface: light-dark(#ffffff,#222421); --ink: light-dark(#22251f,#f2f3ed); --muted: light-dark(#73786f,#b1b6ac); --line: light-dark(#e4e6df,#393d37); --accent: light-dark(#526b50,#b6d1a8); --accent-ink: light-dark(#fff,#172015); }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button, input { font: inherit; }
button { cursor: pointer; }
#app { min-height: 100vh; width: 100%; background-color: var(--page); }
.wrap { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 0; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 720; letter-spacing: -.04em; }
.brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; background: var(--accent); color: var(--accent-ink); }
.nav { display: flex; align-items: center; gap: 20px; color: var(--muted); font-size: 13px; }
.nav a { color: inherit; text-decoration: none; }
.hero { padding: 64px 0 38px; display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: end; }
.eyebrow { margin: 0 0 13px; color: var(--accent); text-transform: uppercase; letter-spacing: .15em; font-size: 11px; font-weight: 750; }
h1 { margin: 0; font-size: clamp(38px, 6vw, 66px); letter-spacing: -.065em; line-height: .99; font-weight: 680; max-width: 680px; }
.intro { margin: 20px 0 0; max-width: 520px; color: var(--muted); line-height: 1.7; font-size: 15px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: end; }
.btn { border: 1px solid var(--line); padding: 11px 15px; border-radius: 999px; color: var(--ink); background: var(--surface); font-size: 13px; font-weight: 650; transition: transform .18s, opacity .18s; }
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin: 22px 0 18px; }
.section-head h2 { margin: 0; font-size: 18px; letter-spacing: -.03em; }
.count { color: var(--muted); font-size: 12px; }
.gallery { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 24px; padding-bottom: 68px; }
.card { min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 17px; overflow: hidden; transition: transform .2s, box-shadow .2s; }
.card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px #0000000d; }
.photo { display: block; width: 100%; aspect-ratio: 1.28; object-fit: cover; background: #dce2d6; cursor: pointer; }
.card-copy { padding: 17px 17px 19px; }
.card-copy h3 { font-size: 16px; letter-spacing: -.025em; margin: 0 0 7px; }
.card-copy p { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0; }
.tag { display: inline-block; margin-top: 14px; color: var(--accent); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 750; }
footer { border-top: 1px solid var(--line); padding: 22px 0 30px; display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; }
.empty { grid-column: 1/-1; padding: 40px 20px; border: 1px dashed var(--line); border-radius: 16px; text-align: center; color: var(--muted); line-height: 1.7; }
#fileInput { display: none; }
dialog { width: min(720px, calc(100% - 28px)); max-height: 90vh; border: 1px solid var(--line); padding: 0; border-radius: 18px; background: var(--surface); color: var(--ink); box-shadow: 0 25px 90px #0005; }
dialog::backdrop { background: #1118; backdrop-filter: blur(3px); }
.modal-img { width: 100%; max-height: 56vh; object-fit: contain; display: block; background: var(--page); }
.modal-copy { padding: 22px; }
.modal-copy h2 { margin: 0 0 9px; letter-spacing: -.04em; }
.modal-copy p { margin: 0; line-height: 1.7; color: var(--muted); }
.modal-actions { display: flex; justify-content: end; margin-top: 18px; }
@media (max-width: 760px) { .wrap { width: min(100% - 28px, 560px); } header { padding: 18px 0; } .nav { gap: 12px; } .hero { padding: 46px 0 25px; grid-template-columns: 1fr; align-items: start; } .actions { justify-content: start; } .gallery { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; padding-bottom: 45px; } .card { border-radius: 13px; } .card-copy { padding: 13px; } .card-copy h3 { font-size: 14px; } .card-copy p { font-size: 12px; } .tag { font-size: 9px; margin-top: 10px; } }
@media (max-width: 430px) { .gallery { grid-template-columns: 1fr; gap: 15px; } .photo { aspect-ratio: 1.45; } .nav a:first-child { display: none; } footer { flex-direction: column; } }
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span>still &amp; seen</span></div>
      <nav class="nav" aria-label="Main navigation"><a href="#gallery">Gallery</a><a href="#about">About</a><button class="btn" id="topAdd" type="button">＋ Add photos</button></nav>
    </header>
    <main>
      <section class="hero" id="about">
        <div><p class="eyebrow">A little collection of things</p><h1>Pictures tell<br>their own stories.</h1><p class="intro">A simple space to share the photos you love, with a few words about what makes each one special.</p></div>
        <div class="actions"><button class="btn primary" id="addBtn" type="button">＋ Add your photos</button><button class="btn" id="resetBtn" type="button">Reset demo</button></div>
      </section>
      <section id="gallery" aria-labelledby="galleryTitle">
        <div class="section-head"><h2 id="galleryTitle">The gallery</h2><span class="count" id="photoCount">6 moments</span></div>
        <div class="gallery" id="galleryGrid"></div>
      </section>
    </main>
    <footer><span>© <span id="year"></span> still &amp; seen</span><span>A quiet corner of the internet.</span></footer>
  </div>
  <input id="fileInput" type="file" accept="image/*" multiple aria-label="Choose photos to add">
  <dialog id="photoDialog"><img class="modal-img" id="modalImg" alt=""><div class="modal-copy"><h2 id="modalTitle"></h2><p id="modalDesc"></p><div class="modal-actions"><button class="btn" id="closeModal" type="button">Close</button></div></div></dialog>
</div>
<script>
const demo = [
 {title:'A slower morning',description:'Soft light, a warm drink, and nowhere in particular to be.',tag:'Everyday moments',art:'<defs><linearGradient id="g1" x2="0" y2="1"><stop stop-color="#e9c9a5"/><stop offset="1" stop-color="#f5e8d6"/></linearGradient></defs><rect width="600" height="440" fill="url(#g1)"/><circle cx="445" cy="100" r="52" fill="#fff1ca"/><path d="M0 300 Q120 245 235 310 T600 270 V440 H0Z" fill="#a4ae8d"/><rect x="165" y="195" width="230" height="175" rx="14" fill="#f7f1e6"/><path d="M190 220 H370 V345 H190Z" fill="#c8a17b"/><ellipse cx="282" cy="333" rx="100" ry="19" fill="#8b6e54"/><path d="M235 280 Q240 245 280 260 Q315 275 295 310 L250 310Z" fill="#f5f0e7"/><path d="M300 280 Q340 250 350 285 L350 315 L300 315Z" fill="#6e8169"/>'},
 {title:'Wild and wonderful',description:'A small reminder that the best details are often found outside.',tag:'Outdoors',art:'<defs><linearGradient id="g2" x2="0" y2="1"><stop stop-color="#c7d8d0"/><stop offset="1" stop-color="#f0e9d7"/></linearGradient></defs><rect width="600" height="440" fill="url(#g2)"/><circle cx="460" cy="90" r="43" fill="#f9edc8"/><path d="M0 270 L120 100 L250 270 L350 130 L600 300 V440 H0Z" fill="#91a99b"/><path d="M0 330 Q170 240 310 340 T600 300 V440 H0Z" fill="#5c7968"/><path d="M0 370 Q160 315 290 375 T600 350 V440 H0Z" fill="#344f43"/><g fill="#f5e8bc"><circle cx="120" cy="340" r="7"/><circle cx="150" cy="370" r="5"/><circle cx="425" cy="340" r="7"/><circle cx="465" cy="370" r="5"/></g>'},
 {title:'Little things, collected',description:'Textures, colours, and everyday objects worth a second look.',tag:'Details',art:'<rect width="600" height="440" fill="#e9ddd0"/><rect x="45" y="45" width="510" height="350" rx="12" fill="#f5eee5"/><path d="M90 290 Q145 175 210 290Z" fill="#b86f53"/><rect x="255" y="130" width="115" height="180" rx="57" fill="#d8a77d"/><rect x="280" y="155" width="65" height="130" rx="32" fill="#e9c5a2"/><circle cx="440" cy="230" r="62" fill="#82917a"/><circle cx="440" cy="230" r="37" fill="#c6cbb4"/><path d="M80 340 H520" stroke="#d0c0ad" stroke-width="3"/>'},
 {title:'By the water',description:'Open skies and the kind of calm that stays with you.',tag:'Places',art:'<defs><linearGradient id="g4" x2="0" y2="1"><stop stop-color="#b6d2d6"/><stop offset="1" stop-color="#f1e3c7"/></linearGradient></defs><rect width="600" height="440" fill="url(#g4)"/><circle cx="150" cy="110" r="43" fill="#f8e4b7"/><path d="M0 230 Q130 200 250 230 T600 215 V440 H0Z" fill="#789da0"/><path d="M0 280 Q160 250 310 285 T600 270 V440 H0Z" fill="#4f7b80"/><path d="M0 360 Q180 330 330 365 T600 345 V440 H0Z" fill="#315c63"/><path d="M400 0 L600 0 L600 220 L510 170Z" fill="#e4d8c2" opacity=".7"/>'},
 {title:'A burst of colour',description:'A bright little moment, saved here so it never gets lost.',tag:'Colour study',art:'<rect width="600" height="440" fill="#e9d5c9"/><circle cx="170" cy="150" r="100" fill="#d88767"/><circle cx="330" cy="125" r="78" fill="#e8b75f"/><circle cx="450" cy="250" r="115" fill="#7c9680"/><path d="M0 310 Q130 230 250 330 T600 300 V440 H0Z" fill="#b8bca1"/><rect x="115" y="255" width="150" height="130" rx="70" fill="#f2e7d5"/><path d="M140 290 Q190 245 240 290" stroke="#b96f56" stroke-width="10" fill="none" stroke-linecap="round"/>'},
 {title:'The view from here',description:'Somewhere to pause, take a breath, and notice what is around you.',tag:'On the way',art:'<defs><linearGradient id="g6" x2="0" y2="1"><stop stop-color="#d8d6c6"/><stop offset="1" stop-color="#f3e6cf"/></linearGradient></defs><rect width="600" height="440" fill="url(#g6)"/><path d="M0 235 L120 165 L220 240 L350 130 L480 220 L600 155 V440 H0Z" fill="#a9b5a0"/><path d="M0 300 Q150 245 290 310 T600 280 V440 H0Z" fill="#6e8975"/><path d="M0 365 Q170 320 330 370 T600 345 V440 H0Z" fill="#435f4d"/><path d="M245 440 Q285 370 300 320 Q330 280 355 260" stroke="#e8d7b8" stroke-width="28" fill="none"/><circle cx="475" cy="80" r="31" fill="#f4e4b8"/>'}
];
function svgUrl(markup){const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440">${markup}</svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
let items=demo.map((x,i)=>({...x,src:svgUrl(x.art),id:'demo-'+i}));
const grid=document.getElementById('galleryGrid'), input=document.getElementById('fileInput'), dialog=document.getElementById('photoDialog');
function render(){grid.innerHTML='';document.getElementById('photoCount').textContent=`${items.length} ${items.length===1?'moment':'moments'}`;if(!items.length){grid.innerHTML='<div class="empty">Your gallery is ready for its first photo.<br>Choose <strong>Add your photos</strong> to start your collection.</div>';return;}items.forEach((item,i)=>{const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.className='photo';img.src=item.src;img.alt=item.title;img.loading='lazy';img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','View '+item.title);const copy=document.createElement('div');copy.className='card-copy';const h=document.createElement('h3');h.textContent=item.title;const p=document.createElement('p');p.textContent=item.description;const tag=document.createElement('span');tag.className='tag';tag.textContent=item.tag||'Your photo';copy.append(h,p,tag);card.append(img,copy);img.addEventListener('click',()=>openPhoto(item));img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPhoto(item)}});grid.append(card);});}
function openPhoto(item){document.getElementById('modalImg').src=item.src;document.getElementById('modalImg').alt=item.title;document.getElementById('modalTitle').textContent=item.title;document.getElementById('modalDesc').textContent=item.description;dialog.showModal();}
function chooseFiles(){input.click()}document.getElementById('addBtn').addEventListener('click',chooseFiles);document.getElementById('topAdd').addEventListener('click',chooseFiles);document.getElementById('closeModal').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
input.addEventListener('change',()=>{const files=Array.from(input.files||[]).filter(f=>f.type.startsWith('image/'));files.forEach((file,index)=>{const reader=new FileReader();reader.onload=()=>{items.unshift({id:'upload-'+Date.now()+'-'+index,title:file.name.replace(/\.[^.]+$/,'').replace(/[-_]/g,' ')||'Your photo',description:'Add a few words about this photo when you customise your website.',tag:'Your photo',src:reader.result});render();};reader.readAsDataURL(file);});input.value='';});
document.getElementById('resetBtn').addEventListener('click',()=>{items=demo.map((x,i)=>({...x,src:svgUrl(x.art),id:'demo-'+i}));render()});document.getElementById('year').textContent=new Date().getFullYear();render();
</script>
</body>
</html>
